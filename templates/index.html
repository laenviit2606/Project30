<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">  
    <title>Language Explorer</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Search</a> 
        <a href="/insights">Insights</a> 
        <a href="/about">About</a>
    </nav>
    <h1>Language Explorer</h1>
    <p> Find an AUSTLANG record by code, name, or alternative name.</p> 

    <form action="/" method="get"> 
        <label for="search">Language code or name:</label> 
        <input type="text" id="search" name="q" value="{{ search_text }}" required> 
        <button type="submit">Search</button> 
    </form>
    </> 
        {% if message%}
            <p>{{ message }}</p>
        {% endif %}
        {% if result %}
            <h2>Search Results:</h2>
            <p>Language Code: {{ result ["language_code"] }}</p>
            <p>Language name: {{ result ["language_name"] }}</p>
        {% endif %} 
</body>
</html>
